# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The same linter and rules as `make lint`. .golangci.yml uses the version 2 format.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile -t mabari:ci .
      # A build alone has missed a container that exits at start, so start it and ask it.
      - name: Health check the running container
        run: |
          docker run -d --name mabari-ci -p 127.0.0.1:4317:4317 --read-only --tmpfs /tmp mabari:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4317/api/health; then exit 0; fi
            sleep 1
          done
          docker logs mabari-ci
          exit 1
